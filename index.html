<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional HRMS demo — Employee, Manager and HR Admin experiences." />
    <title>Northwind HRMS — Demo</title>
    <script>
      try {
        if (localStorage.getItem('hrms-theme') === 'dark') document.documentElement.classList.add('dark')
        if (localStorage.getItem('hrms-lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
